name: Publish NuGet

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to publish, e.g. 1.0.0 (no leading v)."
        required: true
        type: string
  push:
    tags:
      - "v*.*.*"

# Auth: NuGet Trusted Publishing (OIDC) — no stored token. The policy on
# nuget.org (owner: whisperr, repo: WhisperrAI/whisperr-dotnet, workflow:
# publish.yml) lets NuGet/login exchange the GitHub OIDC token for a
# short-lived API key.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SDK
        uses: actions/checkout@v4

      - name: Checkout whisperr-spec
        uses: actions/checkout@v4
        with:
          repository: WhisperrAI/whisperr-spec
          path: whisperr-spec

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            value="${{ github.event.inputs.version }}"
          else
            value="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$value" ]; then
            echo "::error::Could not resolve a package version." >&2
            exit 1
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"
          echo "Publishing version $value"

      - name: Restore
        run: dotnet restore

      - name: Test
        env:
          WHISPERR_SPEC_PATH: ${{ github.workspace }}/whisperr-spec/conformance/wire.json
        run: dotnet test --framework net8.0 --configuration Release --no-restore

      - name: Pack
        run: |
          dotnet pack src/Whisperr/Whisperr.csproj \
            --configuration Release --no-restore --output artifacts \
            -p:Version=${{ steps.version.outputs.value }}
          dotnet pack src/Whisperr.AspNetCore/Whisperr.AspNetCore.csproj \
            --configuration Release --no-restore --output artifacts \
            -p:Version=${{ steps.version.outputs.value }}

      - name: NuGet login (OIDC → short-lived API key)
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: ggent

      - name: Publish
        run: dotnet nuget push "artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
