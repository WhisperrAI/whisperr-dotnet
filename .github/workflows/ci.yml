name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SDK
        uses: actions/checkout@v4

      - name: Checkout whisperr-spec
        uses: actions/checkout@v4
        with:
          repository: WhisperrAI/whisperr-spec
          path: whisperr-spec

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Test
        env:
          WHISPERR_SPEC_PATH: ${{ github.workspace }}/whisperr-spec/conformance/wire.json
        run: dotnet test --configuration Release --no-restore

      - name: Pack
        run: dotnet pack src/Whisperr/Whisperr.csproj --configuration Release --no-restore --output artifacts

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: whisperr-nuget
          path: artifacts/*.nupkg
