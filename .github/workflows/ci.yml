name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: test (${{ matrix.os }} / ${{ matrix.framework }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            framework: net8.0
          - os: windows-latest
            framework: net472
    steps:
      - name: Checkout SDK
        uses: actions/checkout@v4

      - name: Checkout whisperr-spec
        uses: actions/checkout@v4
        with:
          repository: WhisperrAI/whisperr-spec
          # TEMP: contract v2 fixtures (conformance/v2.json). Remove this ref after
          # WhisperrAI/whisperr-spec feat/contract-v2-sdk merges to main.
          ref: feat/contract-v2-sdk
          path: whisperr-spec

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Test
        env:
          WHISPERR_SPEC_PATH: ${{ github.workspace }}/whisperr-spec/conformance/wire.json
        run: dotnet test --framework ${{ matrix.framework }} --configuration Release --no-restore

  pack:
    name: pack
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SDK
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Pack
        run: |
          dotnet pack src/Whisperr/Whisperr.csproj --configuration Release --no-restore --output artifacts
          dotnet pack src/Whisperr.AspNetCore/Whisperr.AspNetCore.csproj --configuration Release --no-restore --output artifacts

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: whisperr-nuget
          path: artifacts/*.nupkg
